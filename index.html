const setMode=m=>{mode=m;document.body.dataset.m=m;cv.classList.toggle('bl',m=='menu'||m=='buy')};
const pickG=()=>{const a=[[0,1],[1,2],[1,2,4],[2,4],[2,3,4]][rk()];return a[Math.random()*a.length|0]};
const ent=(x,y,team,name,gi)=>({x,y,r:14,team,name,gi,hp:100,alive:1,angle:team=='b'?0:Math.PI,fa:0,tx:0,sd:1,ck:0,px:x,py:y,stuck:0,off:0,fl:0});
function world(d){demo=d;let k;do k=Math.random()*MAPS.length|0;while(k==prev);prev=k;map=MAPS[k];walls=map.walls;bu=[];pa=[];bl=[];
 pl=ent(70,300,'b',d?'BOT':S.n,d?2:gun);al=[[65,250,2],[65,350,4],[100,220,1],[100,390,0]].map((p,i)=>ent(p[0],p[1],'b',['GHOST','NOVA','VIPER','REX'][i],p[2]));
 en=[[830,250],[830,350],[790,210],[790,400],[720,300]].map((p,i)=>ent(p[0],p[1],'r',['RAVEN','ZERO','KRAIT','FANG','SHADE'][i],d?2:pickG()));dif=rk()/4}
function resolve(e){e.x=Math.max(10+e.r,Math.min(MW-10-e.r,e.x));e.y=Math.max(10+e.r,Math.min(MH-10-e.r,e.y));for(const w of walls){const cx=Math.max(w.x,Math.min(e.x,w.x+w.w)),cy=Math.max(w.y,Math.min(e.y,w.y+w.h));let dx=e.x-cx,dy=e.y-cy,d=Math.hypot(dx,dy);if(d<e.r){if(!d){dx=1;d=1}e.x+=dx/d*(e.r-d);e.y+=dy/d*(e.r-d)}}}
const move=(e,dx,dy,dt)=>{e.x+=dx*dt;e.y+=dy*dt;resolve(e)};
function los(x1,y1,x2,y2){for(let i=1;i<20;i++){const t=i/20,x=x1+(x2-x1)*t,y=y1+(y2-y1)*t;if(walls.some(w=>x>w.x&&x<w.x+w.w&&y>w.y&&y<w.y+w.h))return false}return true}
function shoot(f,t,w,now){const a=Math.atan2(t.y-f.y,t.x-f.x)+rnd(-w.sp,w.sp);bu.push({x:f.x+Math.cos(a)*24,y:f.y+Math.sin(a)*24,vx:Math.cos(a)*w.v*60,vy:Math.sin(a)*w.v*60,team:f.team,d:w.d,life:1.2,o:f});f.fl=now+60}
function ai(b,foes,now,dt,F){const t=foes.filter(e=>e.alive).sort((a,c)=>dist(b,a)-dist(b,c))[0];if(!t)return;
 const d=dist(b,t),vis=los(b.x,b.y,t.x,t.y);b.angle=Math.atan2(t.y-b.y,t.x-b.x);
 if(now>b.tx){b.tx=now+rnd(500,1400);b.sd=Math.random()<.5?1:-1}
 let fw=d>(vis?200:0)?1:0,sd=vis?b.sd*.6:0;
 b.ck-=dt;if(b.ck<=0){b.ck=.4;if(fw&&Math.hypot(b.x-b.px,b.y-b.py)<4){b.stuck=.7;b.off=rnd(-1.8,1.8)}b.px=b.x;b.py=b.y}
 let ma=b.angle;if(b.stuck>0){b.stuck-=dt;ma+=b.off;fw=1}
 move(b,(Math.cos(ma)*fw+Math.cos(ma+1.571)*sd)*95*F.mv,(Math.sin(ma)*fw+Math.sin(ma+1.571)*sd)*95*F.mv,dt);
 if(vis&&d<480&&now>b.fa){shoot(b,t,{d:F.d,sp:F.sp,v:9},now);b.fa=now+F.i*rnd(.8,1.3)}}
function dmg(e,d,by){if(!e.alive)return;e.hp-=d;pa.push({x:e.x,y:e.y,life:.25});if(e===pl&&!demo)hurt=.4;
 if(e.hp<=0){e.hp=0;e.alive=0;bl.push({x:e.x,y:e.y,r:rnd(10,16)});if(bl.length>30)bl.shift();if(by===pl&&!demo&&e.team=='r'){mk++;S.tk++;send({t:'k'});gainXp(1);ui();lbr()}
  if(en.every(x=>!x.alive))endR('b');else if([pl,...al].every(x=>!x.alive))endR('r')}}
function endR(w){if(mode=='play'){sc2[w=='b'?0:1]++;setMode('end');ov(`<h2 style="color:${w=='b'?'#b8ff45':'#ff6e61'}">${w=='b'?'RAUND KAZANILDI':'RAUND KAYBEDİLDİ'}</h2><p>MAVİ ${sc2[0]} - ${sc2[1]} KIRMIZI</p>`,1);setTimeout(()=>mode=='end'&&(rd>=5?finish():nextRd()),2300)}
 else if(mode=='menu'&&!dend){dend=1;setTimeout(()=>{world(true);dend=0},1800)}}
function ov(h,c){$('ov').style.display=h?'flex':'none';$('ov').className=c?'cl':'';if(h)$('ovc').innerHTML=h}
function nextRd(){rd++;world(false);setMode('buy');ov(`<p style="margin:0">RAUND ${rd}/5 · ${map.n}</p><h2>SİLAHINI SEÇ</h2><div class="gs">${wp.map((w,i)=>`<button class="gc" data-g="${i}"><b>${w.n}</b><span>${w.t}</span><i>HASAR ${w.d} · ŞARJÖR ${w.m}</i></button>`).join('')}</div>`)}
function finish(){const win=sc2[0]>sc2[1],r0=rk(),l0=S.lv;if(win){S.rp+=20;gainXp(3)}save();ui();const lg=S.lv-l0,up=rk()>r0;
 ov(`<h2 style="color:${win?'#6cb8ff':'#ff6e61'}">${win?'MAVİ':'KIRMIZI'} TAKIM KAZANDI</h2><p style="font-size:22px">MAVİ ${sc2[0]} - ${sc2[1]} KIRMIZI</p><p>${win?'+20 RP':'RP değişmedi'} · ${lg?'+'+lg+' SEVİYE':'seviye aynı'} · ${mk} kill${up?'<br>YENİ RANK: '+RK[rk()][0]:''}</p><button class="gb" id="bk">MENÜYE DÖN</button>`,1)}
$('ov').onclick=e=>{const b=e.target.closest('[data-g]');if(b){gun=+b.dataset.g;pl.gi=gun;am={m:wp[gun].m,rs:wp[gun].rs};ov(0);setMode('play')}if(e.target.closest('#bk'))toMenu()};
function toMenu(){if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});try{screen.orientation.unlock()}catch(e){}ov(0);sh=0;world(true);setMode('menu');ui();hi()}
$('xb').onclick=toMenu;
$('play').onclick=()=>{rd=0;sc2=[0,0];mk=0;if(touch){const d=document.documentElement;Promise.resolve(d.requestFullscreen&&d.requestFullscreen()).catch(()=>{}).then(()=>{try{screen.orientation.lock('landscape').catch(()=>{})}catch(e){}})}nextRd()};
function upd(dt,now){
 if(dend)return;const F0={d:12,i:650,sp:.1,mv:1},Fe=demo?{d:10,i:900,sp:.15,mv:.9}:{d:6+dif*9+rd*.6,i:1100-dif*500,sp:.21-.1*dif,mv:.7+dif*.5};
 if(demo)ai(pl,en,now,dt,F0);
 else if(pl.alive){let x=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),y=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);if(touch){x=jv.x;y=jv.y}const l=Math.max(1,Math.hypot(x,y));move(pl,x/l*200,y/l*200,dt);
  if(touch){const t=en.filter(e=>e.alive&&dist(e,pl)<500&&los(pl.x,pl.y,e.x,e.y)).sort((a,b)=>dist(a,pl)-dist(b,pl))[0];if(t)pl.angle=Math.atan2(t.y-pl.y,t.x-pl.x);else if(x||y)pl.angle=Math.atan2(y,x)}
  else pl.angle=Math.atan2((my-oy)/sc-pl.y,(mx-ox)/sc-pl.x);
  const w=wp[gun];if(am.m<=0&&am.rs>0){const n=Math.min(w.m,am.rs);am.m=n;am.rs-=n}
  if(sh&&am.m>0&&now-lastShot>w.r){shoot(pl,{x:pl.x+Math.cos(pl.angle)*1000,y:pl.y+Math.sin(pl.angle)*1000},w,now);am.m--;lastShot=now}}
 al.forEach(b=>b.alive&&ai(b,en,now,dt,F0));en.forEach(b=>b.alive&&ai(b,[pl,...al],now,dt,Fe));
 bu.forEach(b=>{b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt});
 bu=bu.filter(b=>{if(b.life<=0||b.x<0||b.x>MW||b.y<0||b.y>MH||walls.some(w=>b.x>w.x&&b.x<w.x+w.w&&b.y>w.y&&b.y<w.y+w.h))return false;
  for(const e of b.team=='b'?en:[pl,...al])if(e.alive&&dist(b,e)<e.r+3){dmg(e,b.d,b.o);return false}return true});
 pa.forEach(p=>p.life-=dt);pa=pa.filter(p=>p.life>0);hurt=Math.max(0,hurt-dt)}
function soldier(e,now){const red=e.team=='r',c=red?'#b84545':'#3a86b8',d=red?'#5a2323':'#1b4560',L=wp[e.gi].L;
 ctx.save();ctx.translate(e.x,e.y);ctx.rotate(e.angle);
 ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(2,4,16,13,0,0,7);ctx.fill();
 ctx.fillStyle='#10171b';ctx.fillRect(8,-2,L,4);ctx.fillStyle='#6a7880';ctx.fillRect(8+L-5,-1.5,5,3);
 ctx.strokeStyle=d;ctx.lineWidth=5;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(0,-10);ctx.lineTo(12,-2);ctx.moveTo(0,10);ctx.lineTo(10,2);ctx.stroke();
 ctx.fillStyle='#e0ac69';ctx.beginPath();ctx.arc(12,-2,3,0,7);ctx.arc(10,2,3,0,7);ctx.fill();
 ctx.fillStyle=c;ctx.beginPath();ctx.ellipse(-1,0,9,15,0,0,7);ctx.fill();ctx.fillStyle=d;ctx.fillRect(-6,-6,4,12);
 ctx.fillStyle=d;ctx.beginPath();ctx.arc(1,0,8,0,7);ctx.fill();ctx.fillStyle='#ffffff30';ctx.beginPath();ctx.arc(-1,-2,4,0,7);ctx.fill();ctx.fillStyle='#0b1014';ctx.fillRect(5,-4,3,8);
 if(e===pl&&!demo){ctx.strokeStyle='#b8ff45';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,17,0,7);ctx.stroke()}
 if(e.fl>now){ctx.fillStyle='#ffd57c';ctx.beginPath();ctx.moveTo(8+L,0);ctx.lineTo(8+L+10,-5);ctx.lineTo(8+L+10,5);ctx.fill()}
 ctx.restore();ctx.fillStyle='#000a';ctx.fillRect(e.x-16,e.y-27,32,4);ctx.fillStyle=red?'#ff6e61':'#b8ff45';ctx.fillRect(e.x-16,e.y-27,32*e.hp/100,4);
 ctx.font='10px sans-serif';ctx.textAlign='center';ctx.fillStyle='#fff';ctx.fillText(e.name,e.x,e.y-31)}
function draw(now){
 ctx.fillStyle='#05080a';ctx.fillRect(0,0,W,H);ctx.save();ctx.translate(ox,oy);ctx.scale(sc,sc);
 ctx.fillStyle=map.f;ctx.fillRect(0,0,MW,MH);ctx.fillStyle='#ffffff09';for(let y=0;y<MH;y+=40)for(let x=(y/40%2)*40;x<MW;x+=80)ctx.fillRect(x,y,40,40);
 ctx.strokeStyle=map.a+'30';ctx.lineWidth=2;ctx.setLineDash([10,10]);ctx.beginPath();ctx.arc(450,305,70,0,7);ctx.moveTo(450,10);ctx.lineTo(450,MH-10);ctx.stroke();ctx.setLineDash([]);
 ctx.strokeStyle=map.a+'66';ctx.strokeRect(10,10,MW-20,MH-20);
 bl.forEach(b=>{ctx.fillStyle='rgba(120,12,12,.5)';ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.fill()});
 walls.forEach(w=>{ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(w.x+6,w.y+7,w.w,w.h);ctx.fillStyle=map.w;ctx.fillRect(w.x,w.y,w.w,w.h);ctx.fillStyle='#ffffff40';ctx.fillRect(w.x,w.y,w.w,4);ctx.fillStyle='#0004';ctx.fillRect(w.x,w.y+w.h-4,w.w,4);ctx.strokeStyle=map.a+'66';ctx.lineWidth=1;ctx.strokeRect(w.x+.5,w.y+.5,w.w-1,w.h-1);ctx.fillStyle='#0003';for(let x=w.x+12;x<w.x+w.w-6;x+=24)ctx.fillRect(x,w.y+w.h/2-1,10,2)});
 bu.forEach(b=>{ctx.strokeStyle=b.team=='b'?'#caff70':'#ff7869';ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(b.x-b.vx*.025,b.y-b.vy*.025);ctx.stroke()});
 pa.forEach(p=>{ctx.fillStyle='#ffd57caa';ctx.beginPath();ctx.arc(p.x,p.y,6*(1-p.life*3),0,7);ctx.fill()});
 [...al,...en,pl].forEach(e=>e.alive&&soldier(e,now));
 ctx.restore();if(hurt>0){ctx.fillStyle='rgba(255,0,0,'+hurt*.5+')';ctx.fillRect(0,0,W,H)}}
function hud(){$('hp').style.width=pl.hp+'%';$('hpn').textContent=Math.ceil(pl.hp);$('am').textContent=wp[gun].n+'  '+am.m+' / '+am.rs;$('rdt').textContent=`RAUND ${rd}/5   MAVİ ${sc2[0]} - ${sc2[1]} KIRMIZI`}
function frame(t){const dt=Math.min(.033,(t-last)/1000||0);last=t;if(mode=='play'||mode=='menu')upd(dt,t);draw(t);if(mode=='play')hud();requestAnimationFrame(frame)}
addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys[k]=1;if(k=='r'&&mode=='play'){const w=wp[gun],n=Math.min(w.m-am.m,am.rs);am.m+=n;am.rs-=n}});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
cv.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY});cv.addEventListener('mousedown',e=>{mx=e.clientX;my=e.clientY;if(mode=='play'&&e.button==0)sh=1});addEventListener('mouseup',()=>sh=0);cv.addEventListener('contextmenu',e=>e.preventDefault());
const jz=$('jz'),jk=$('jk');let jid=null;
function jm(e){const r=jz.getBoundingClientRect(),m=r.width/2;let dx=e.clientX-r.left-m,dy=e.clientY-r.top-m,d=Math.hypot(dx,dy);if(d>m){dx*=m/d;dy*=m/d}jk.style.transform=`translate(${dx}px,${dy}px)`;jv={x:dx/m,y:dy/m}}
jz.addEventListener('pointerdown',e=>{jid=e.pointerId;jz.setPointerCapture(e.pointerId);jm(e)});jz.addEventListener('pointermove',e=>{if(e.pointerId==jid)jm(e)});['pointerup','pointercancel'].forEach(v=>jz.addEventListener(v,()=>{jid=null;jv={x:0,y:0};jk.style.transform=''}));
const fr=$('fr');fr.addEventListener('pointerdown',e=>{e.preventDefault();sh=1});['pointerup','pointercancel','pointerleave'].forEach(v=>fr.addEventListener(v,()=>sh=0));
ui();lbr();conn();world(true);setMode('menu');requestAnimationFrame(frame);
})();
</script></body></html>
